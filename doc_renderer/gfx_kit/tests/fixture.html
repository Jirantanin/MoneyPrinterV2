<!doctype html>
<html><head><meta charset="utf-8">
<!-- Test fixture: loads the kit modules (missing files are skipped), then ?run=<name> calls FIXTURES[name](). -->
<style>
@font-face{font-family:Kanit;src:url("../../../.mp/fonts/Kanit-Bold.ttf");font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block}
</style></head><body>
<script>
const KIT_FILES = ['kit.js', 'library.js', 'finish.js', 'glow.js', 'paper.js', 'cast.js', 'flat.js', 'motion.js', 'cam.js', 'type.js', 'cast_rig.js'];
const Q = new URLSearchParams(location.search);
const loadScript = src => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = s.onerror = res; document.head.appendChild(s); });
window.FIXTURES = {};
window.__ready = (async () => {
  for (const f of KIT_FILES) await loadScript('../' + f);
  await loadScript('fixtures.js');
  const run = Q.get('run');
  if (run) { if (!FIXTURES[run]) throw new Error('no fixture ' + run); await FIXTURES[run](); }
  return true;
})();
window.__seek = t => window.FIX_RENDER && window.FIX_RENDER(t);
</script>
</body></html>

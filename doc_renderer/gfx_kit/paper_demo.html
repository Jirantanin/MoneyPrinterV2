<!doctype html>
<html><head><meta charset="utf-8">
<!-- Check page for paper.js: torn cut-outs, boil, tag strip, graph sheet, flame + night pools, and the kit's SVG truth tag
     on top of the paper canvas. Stills:
       node doc_renderer/gfx_kit/record.cjs doc_renderer/gfx_kit/paper_demo.html night 2 <prefix> --stills 0.5,1.5
     Names: night (lapis + torch), day (graph sheet + bench). Examples only; each episode chooses its own palette. -->
<style>
@font-face{font-family:Kanit;src:url("../../.mp/fonts/Kanit-Bold.ttf");font-weight:700}
@font-face{font-family:Kanit;src:url("../../.mp/fonts/Kanit-Black.ttf");font-weight:900}
html,body{margin:0;background:#111;overflow:hidden}
svg{display:block}
text{font-family:Kanit,'Leelawadee UI',sans-serif}
</style></head><body>
<script src="kit.js"></script>
<script src="library.js"></script>
<script src="paper.js"></script>
<script>
const NAME = new URLSearchParams(location.search).get('g') || 'night';
function look(night) {
  const { svg } = stage(); const c = paperStage(svg);
  const tag = truthTag(el('g', {}, svg), 'compare', 1500, 210);
  return t => {
    paperFrame(t);
    paper(rectPts(-20, -20, KW + 20, KH + 20), night ? '#1E3263' : '#8C6A45', 1, { edge: false, amp: 0, slow: true });
    const sheet = [[160, 120], [1760, 110], [1772, 800], [150, 812]];
    paper(sheet, night ? '#E2D1A6' : '#E8DDBF', 2, { edgeW: 7, edgeAmp: 3.6, amp: 1.8, fiber: night, slow: true });
    if (!night) pgrid(sheet, 48);
    paper([[-20, 840], [KW + 20, 830], [KW + 20, KH + 20], [-20, KH + 20]], night ? '#C9934E' : '#7A4E2E', 3, { edgeW: 6, edgeAmp: 3.4, amp: 1.6, slow: true });
    const k = spring(t - .3, .5, 2.2);
    c.save(); c.translate(560, 700); c.scale(1, Math.max(0, k));
    paper(ellPts(0, -160, 150, 160, 30), '#C48A74', 10, { speck: true });              // boils every 2 frames
    paper(starPts(260, -380, 60), '#D9A441', 11, { edge: false });
    c.restore();
    pline([[900, 600], [1020, 520], [1140, 610], [1260, 520]], '#2A1C12', 6, 12, { dash: [16, 10] });
    ptag('ป้ายบนกระดาษฉีก', 1000, 380, pop(t, .5), 13);
    if (night) { pflame(1400, 640, 1.2, t, 20); pnight([[1400, 600, 520, 1]], { alpha: .6 }); }
    tag.update(t, .8);
    pfinish();
  };
}
const SCENES = { night: () => look(true), day: () => look(false) };
let render = null;
window.__ready = document.fonts.load('900 40px Kanit').then(() => { render = SCENES[NAME](); render(0); return true; });
window.__seek = t => render(t);
</script>
</body></html>

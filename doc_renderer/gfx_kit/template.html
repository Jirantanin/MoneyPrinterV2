<!doctype html>
<html><head><meta charset="utf-8">
<!-- Starter page for an episode's explainer graphics. Copy to .mp/<episode>/<graphics dir>/gfx.html;
     the relative paths below assume that location (fonts in .mp/fonts, kit in doc_renderer/gfx_kit).
     Record: node doc_renderer/gfx_kit/record.cjs <that gfx.html> demo 8 <out.mp4>
     Rules: every number/claim matches the reviewed script; keep the qualification footer on screen;
     anchor reveal times to speech (scripts/producer_score.py onsets, per-scene ASR).
     Shared cast, finish layer, glow look and reuse rules: LIBRARY.md. Set this episode's own look with theme({...}) before building. -->
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500&display=block" rel="stylesheet">
<style>
@font-face{font-family:Kanit;src:url("../../fonts/Kanit-Bold.ttf");font-weight:700}
@font-face{font-family:Kanit;src:url("../../fonts/Kanit-Black.ttf");font-weight:900}
@font-face{font-family:Fredoka;src:url("../../fonts/Fredoka%5Bwdth%2Cwght%5D.ttf");font-weight:300 700}
@font-face{font-family:Mitr;src:url("../../fonts/Mitr-Medium.ttf");font-weight:500}
@font-face{font-family:Mitr;src:url("../../fonts/Mitr-SemiBold.ttf");font-weight:600}
html,body{margin:0;background:#0c0a24;overflow:hidden}
svg{display:block}
text{font-family:Kanit,'Leelawadee UI',sans-serif}
</style></head><body>
<script src="../../../doc_renderer/gfx_kit/kit.js"></script>
<script src="../../../doc_renderer/gfx_kit/library.js"></script>
<script src="../../../doc_renderer/gfx_kit/finish.js"></script>
<script src="../../../doc_renderer/gfx_kit/glow.js"></script>
<script src="../../../doc_renderer/gfx_kit/paper.js"></script>
<script src="../../../doc_renderer/gfx_kit/flat.js"></script>
<script src="../../../doc_renderer/gfx_kit/cast.js"></script>
<script src="../../../doc_renderer/gfx_kit/motion.js"></script>
<script src="../../../doc_renderer/gfx_kit/cam.js"></script>
<script src="../../../doc_renderer/gfx_kit/type.js"></script>
<script src="../../../doc_renderer/gfx_kit/cast_rig.js"></script>
<script>
PAPER.font = 'Mitr';   // new pages: Thai on paper strips in Mitr (paper.js keeps Kanit for older pages)
// theme({ bg: [...], nebula: [...], palette: {...} });   // this episode's art direction (visual_rules.art_direction)
const NAME = new URLSearchParams(location.search).get('g');

function demo() {
  const { svg } = stage();
  finishDefs(svg, {});   // this episode's rim/shade/light colours (finish.js, LIBRARY.md)
  glowDefs(svg, {});     // this episode's glow colours (glow.js, the house default look)
  const bg = background(svg, 11);
  const cam = el('g', {}, svg);
  const earth = planet(cam, 90, 'earth', 9);
  const m = mascot(cam, 1500, 880, 1);
  litPass(earth);
  const frame = glowFrame(svg);
  const hud = el('g', {}, svg);
  const title = chip(hud, 960, 110, [{ text: 'หัวข้อของกราฟิก', size: 52, color: C.white, weight: 900 }]);
  const foot = footer(hud, 'ข้อความกำกับ: แบบจำลอง / คำนวณสมมติ / ที่มา', 0.5);
  return t => {
    bg(t); frame(t);
    earth.state({ x: 960, y: 560, s: pop(t, .4, .6) });
    m.update(t, { in: .8, look: [-1, -.4], blink: [3.0], hop: [5.0], bubble: { ch: '?', tIn: 2.0, tOut: 4.5 } });
    title.update(t, .2);
    foot(t);
  };
}

const SCENES = { demo };
let render = null;
window.__MBLUR = 2;   // motion blur for this page's MP4s (record.cjs); list hard steps in window.__CUTS = [t, ...]
window.__ready = typeReady()
  .then(() => { render = SCENES[NAME](); render(0); return true; });
window.__seek = t => render(t);
</script>
</body></html>
